spring:
  application:
    name: sherlock-homes
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sherlock_homes}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1kZWZhdWx0LWp3dC1zZWNyZXQta2V5LWZvci1kZXYtMTIzNDU2}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:test_key}
    key-secret: ${RAZORPAY_KEY_SECRET:test_secret}
  game:
    default-price: ${DEFAULT_GAME_PRICE:9.99}

